<div id="sidebar">
  <h3>TimePlannerAdmin</h3>

  <nav class="links">
    <app-nav-item label="Hem" link="/dashboard" />

    <mat-divider />

    <app-nav-item label="Alla Användare" link="/dashboard/users" />
    <app-nav-item label="Skapa användare" link="/dashboard/users/user-create" />
    <mat-divider />
    <app-nav-item label="Tidsbokning" link="/dashboard/assignments" />
  </nav>

  <div class="sidebar-bottom">
    <div class="theme-switch">
      <mat-icon>light_mode</mat-icon>''
      <mat-slide-toggle
        [checked]="theme.isDark()"
        (change)="theme.toggle()"
        aria-label="Mörkt läge"
      />
      <mat-icon>dark_mode</mat-icon>
    </div>
    <button type="button" (click)="logout()">Logga ut</button>
  </div>
</div>
