@if (loading()) {
  <mat-progress-spinner mode="indeterminate" diameter="24" />
}

<table mat-table [dataSource]="users()">
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Epost</th>
    <td mat-cell *matCellDef="let element">{{ element.email }}</td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Namn</th>
    <td mat-cell *matCellDef="let element">{{ element.name }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let element">
      <div class="btn-row">
        <button
          class="mat-error-variant"
          matFab="outlined"
          aria-label="Delete button"
          (click)="onDelete(element)"
        >
          <mat-icon>delete</mat-icon>
        </button>
        <button class="edit-fab" matFab="outlined" aria-label="Edit button">
          <mat-icon>edit</mat-icon>
        </button>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
