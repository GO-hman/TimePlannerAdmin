<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="assignment-form">
    <mat-form-field>
      <mat-label>Användare</mat-label>
      <mat-select (selectionChange)="selectedUserId.set($event.value)" formControlName="user">
        @for (user of users(); track user.id) {
          <mat-option [value]="user.id">{{ user.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Välj datumspann</mat-label>
      <mat-date-range-input [rangePicker]="picker">
        <input matStartDate placeholder="Startdatum" formControlName="startTime" />
        <input matEndDate placeholder="Slutdatum" formControlName="endTime" />
      </mat-date-range-input>
      <mat-hint>MM/DD/YYYY – MM/DD/YYYY</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-date-range-picker #picker></mat-date-range-picker>
    </mat-form-field>

    <button matButton="outlined" type="submit" [disabled]="loading()">Skapa tidsbokning</button>
    @if (loading()) {
      <mat-progress-spinner mode="indeterminate" diameter="24" />
    }
  </div>
</form>

@if (selectedUser(); as user) {
  <h1>{{ user.name }}</h1>
}

<table mat-table [dataSource]="assignments()">
  <ng-container matColumnDef="user">
    <th mat-header-cell *matHeaderCellDef>Användare</th>
    <td mat-cell *matCellDef="let element">{{ element.user.name }}</td>
  </ng-container>

  <ng-container matColumnDef="startTime">
    <th mat-header-cell *matHeaderCellDef>Start</th>
    <td mat-cell *matCellDef="let element">{{ element.startTime }}</td>
  </ng-container>

  <ng-container matColumnDef="endTime">
    <th mat-header-cell *matHeaderCellDef>Slut</th>
    <td mat-cell *matCellDef="let element">{{ element.endTime }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let element">
      <div class="btn-row">
        <button
          class="mat-error-variant"
          matFab="outlined"
          aria-label="Delete button"
          (click)="onDelete(element)"
        >
          <mat-icon>delete</mat-icon>
        </button>
        <button class="edit-fab" matFab="outlined" aria-label="Edit button">
          <mat-icon>edit</mat-icon>
        </button>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
